<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhammad Sameer, Eventive</title>
<meta name="description" content="Save Muhammad Sameer's contact">
<meta name="theme-color" content="#1F3BD1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --cobalt: #1F3BD1;
    --cobalt-deep: #152A9E;
    --saffron: #FFB400;
    --ink: #151A2E;
    --muted: #5B6178;
    --paper: #FFFFFF;
    --line: #E3E6F0;
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(120% 70% at 50% 0%, var(--cobalt) 0%, var(--cobalt-deep) 100%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px calc(32px + env(safe-area-inset-bottom, 0px));
  }

  /* lanyard strap */
  .strap {
    width: 34px;
    height: calc(56px + env(safe-area-inset-top, 0px));
    background: repeating-linear-gradient(90deg, var(--saffron) 0 6px, #F0A500 6px 8px);
    flex-shrink: 0;
  }
  .clip {
    width: 52px; height: 22px;
    border: 4px solid #C9CEDD;
    border-top: none;
    border-radius: 0 0 14px 14px;
    margin-top: -2px;
    flex-shrink: 0;
  }

  .badge {
    width: 100%;
    max-width: 380px;
    background: var(--paper);
    border-radius: 22px;
    padding: 20px 26px 26px;
    margin-top: -6px;
    box-shadow: 0 24px 60px rgba(8, 18, 80, .45);
    transform-origin: 50% -40px;
    animation: swing 1.4s cubic-bezier(.3, 1.5, .5, 1) both;
  }
  @keyframes swing {
    0%   { transform: rotate(-7deg); }
    100% { transform: rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) { .badge { animation: none; } }

  .slot {
    width: 58px; height: 9px;
    border-radius: 9px;
    background: var(--line);
    margin: 0 auto 30px;
  }
  .company {
    font-weight: 600;
    font-size: 1rem;
    color: var(--cobalt);
    margin-bottom: 6px;
  }
  h1 {
    font-weight: 800;
    font-size: clamp(2rem, 9.5vw, 2.9rem);
    overflow-wrap: break-word;
    line-height: .95;
    letter-spacing: -.035em;
    margin-bottom: 22px;
  }
  .number {
    display: block;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    font-variant-numeric: tabular-nums;
    padding: 14px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 22px;
  }
  .number span { display: block; font-size: .85rem; font-weight: 400; color: var(--muted); margin-bottom: 2px; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    min-height: 54px;
    border-radius: 14px;
    font: inherit; font-weight: 600; font-size: 1.05rem;
    text-decoration: none;
    cursor: pointer;
  }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .save { background: var(--ink); color: #fff; margin-bottom: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ghost { background: #F2F4FA; color: var(--ink); font-size: .98rem; gap: 8px; }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible, .number:focus-visible { outline: 3px solid var(--saffron); outline-offset: 3px; }

  .hint {
    max-width: 380px;
    margin-top: 18px;
    color: rgba(255,255,255,.78);
    font-size: .9rem;
    line-height: 1.45;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="strap" aria-hidden="true"></div>
  <div class="clip" aria-hidden="true"></div>

  <main class="badge">
    <div class="slot" aria-hidden="true"></div>
    <p class="company">Eventive</p>
    <h1>Muhammad Sameer</h1>

    <a class="number" href="tel:+966501523882">
      <span>Mobile</span>+966 50 152 3882
    </a>

    <a class="btn save" href="sameer.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/><path d="M19 3v6M16 6h6"/></svg>
      Save contact
    </a>
    <div class="row">
      <a class="btn ghost" href="tel:+966501523882">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        Call
      </a>
      <a class="btn ghost" href="https://wa.me/966501523882">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
        WhatsApp
      </a>
    </div>
  </main>

  <p class="hint">If Save contact doesn&rsquo;t open on your phone, tap Call or WhatsApp to reach me directly.</p>
</body>
</html>
